<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinBiladi — Videos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brand: #b5432a;
    --brand-dark: #933522;
    --bg: #faf8f5;
    --text: #1a1a1a;
    --text-light: #555;
    --text-muted: #888;
    --border: #e8e4df;
    --card-bg: #fff;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Source Sans 3', 'Segoe UI', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--serif);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── NAV ─── */
  .nav {
    display: flex; align-items: center; justify-content: center;
    padding: clamp(18px, 3vw, 28px) clamp(16px, 4vw, 40px);
    background: var(--bg);
    border-bottom: 1px solid #000;
  }
  .nav-brand {
    display: inline-block;
    cursor: pointer;
    transition: opacity .3s;
    line-height: 0;
  }
  .nav-brand:hover { opacity: .85; }
  .nav-logo {
    height: clamp(72px, 11vw, 110px);
    width: auto;
    display: block;
    border-radius: 8px;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative; width: 100%;
    height: clamp(260px, 55vw, 540px);
    overflow: hidden; background: #111;
  }
  .hero-img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .7s ease;
  }
  .hero:hover .hero-img { transform: scale(1.03); }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.55) 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; cursor: pointer;
    padding: 0 clamp(48px, 10vw, 80px);
  }
  .hero-tag {
    font-family: var(--sans);
    font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: 4px; text-transform: uppercase;
    color: rgba(255,255,255,.8);
  }
  .hero-title {
    font-size: clamp(22px, 5vw, 54px);
    font-weight: 700; color: #fff;
    text-shadow: 0 2px 24px rgba(0,0,0,.45);
    text-align: center; line-height: 1.12;
    max-width: 700px;
    overflow-wrap: break-word;
    word-wrap: break-word;
    /* Max 2 regels */
    display: -webkit-box;
    -webkit-line-clamp: 2;
            line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-play-btn {
    margin-top: 6px; transition: transform .35s;
  }
  .hero-play-btn svg {
    width: clamp(48px, 8vw, 72px);
    height: clamp(48px, 8vw, 72px);
  }
  .hero:hover .hero-play-btn { transform: scale(1.12); }

  .hero-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    opacity: .65; transition: opacity .3s;
    padding: 10px;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.5));
  }
  .hero-arrow:hover { opacity: 1; }
  .hero-arrow.l { left: clamp(4px, 1.5vw, 18px); }
  .hero-arrow.r { right: clamp(4px, 1.5vw, 18px); }
  .hero-arrow svg {
    width: clamp(26px, 4vw, 36px);
    height: clamp(26px, 4vw, 36px);
  }

  /* ─── TABS ─── */
  .tabs-wrap {
    text-align: center;
    padding: clamp(24px, 4vw, 36px) clamp(16px, 3vw, 24px) 0;
  }
  .tabs {
    display: inline-flex;
    gap: clamp(16px, 3vw, 32px);
    font-family: var(--sans);
    font-size: clamp(13px, 1.4vw, 15px);
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    cursor: pointer; padding-bottom: 6px;
    color: #999; border-bottom: 2px solid transparent;
    transition: all .3s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tabs-sub {
    font-family: var(--sans);
    font-size: clamp(13px, 1.4vw, 15px);
    color: var(--text-muted);
    margin-top: 14px;
    line-height: 1.5;
    padding: 0 clamp(16px, 3vw, 24px);
  }

  /* ─── GRID ─── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(20px, 2.5vw, 32px);
    padding: clamp(24px, 4vw, 36px) clamp(16px, 3vw, 40px) clamp(40px, 6vw, 64px);
    max-width: 1220px;
    margin: 0 auto;
  }
  .card { cursor: pointer; transition: transform .3s; }
  .card:hover { transform: translateY(-5px); }
  .card-thumb {
    position: relative; width: 100%; aspect-ratio: 3/2;
    border-radius: 5px; overflow: hidden; background: #ddd;
  }
  .card-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s;
  }
  .card:hover .card-thumb img { transform: scale(1.06); }
  .card-play {
    position: absolute; bottom: 10px; right: 10px;
    opacity: .8; transition: all .3s;
  }
  .card:hover .card-play { opacity: 1; transform: scale(1.1); }
  .card-meta {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 12px;
    color: var(--text-muted); margin-top: 12px; letter-spacing: .3px;
  }
  .card-title {
    font-size: clamp(16px, 1.7vw, 19px);
    font-weight: 600; line-height: 1.35;
    margin-top: 5px; color: var(--text);
    overflow-wrap: break-word;
    word-wrap: break-word;
    /* Max 2 regels — kapt af met ... bij langere titels */
    display: -webkit-box;
    -webkit-line-clamp: 2;
            line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-dur {
    font-family: var(--sans); font-size: 13px;
    color: #aaa; margin-top: 3px;
  }

  /* ─── DETAIL ─── */
  .detail {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 clamp(16px, 3vw, 40px) clamp(40px, 6vw, 64px);
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13px;
    letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-muted); cursor: pointer;
    background: none; border: none; padding: 24px 0;
    transition: color .3s;
  }
  .back-btn:hover { color: var(--brand); }

  .video-wrap {
    position: relative; width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    border-radius: 5px; overflow: hidden;
    background: #000;
  }
  .video-wrap iframe,
  .video-wrap > div,
  #ytPlayer {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }

  .detail-title {
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 700; line-height: 1.22;
    margin-top: 26px;
    overflow-wrap: break-word;
    word-wrap: break-word;
    /* Max 3 regels voor de beschrijving */
    display: -webkit-box;
    -webkit-line-clamp: 3;
            line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .detail-body {
    font-family: var(--sans);
    font-size: clamp(15px, 1.6vw, 17px);
    line-height: 1.78; color: #444;
    margin-top: 18px;
  }
  .detail-body p { margin-bottom: 16px; }

  .detail-credits {
    margin-top: 24px; padding-top: 18px;
    border-top: 1px solid var(--border);
    font-family: var(--sans); font-size: 14px;
    color: var(--text-muted); line-height: 2;
  }
  .detail-credits strong { color: var(--text-light); font-weight: 600; }

  .more-section {
    padding-top: 36px; margin-top: 36px;
    border-top: 1px solid var(--border); clear: both;
  }
  .more-title {
    font-size: clamp(18px, 2.2vw, 22px);
    font-weight: 600; margin-bottom: 24px;
  }
  .more-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(16px, 2vw, 24px);
  }

  /* ─── FADE ─── */
  .fade-in { animation: fadeUp .45s ease forwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── FOOTER ─── */
  .footer {
    border-top: 1px solid var(--border);
    padding: clamp(32px, 5vw, 48px) clamp(16px, 4vw, 40px) 28px;
    background: var(--bg);
    font-family: var(--sans);
  }
  .footer-inner {
    max-width: 1220px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }
  .footer-heading {
    font-family: var(--serif);
    font-size: clamp(16px, 1.8vw, 19px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: .5px;
  }
  .footer-contact {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.7;
  }
  .footer-contact a {
    color: var(--brand);
    text-decoration: none;
    transition: color .3s;
  }
  .footer-contact a:hover {
    color: var(--brand-dark);
    text-decoration: underline;
  }
  .footer-divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }
  .footer-copy {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: .5px;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .more-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .more-grid { grid-template-columns: 1fr; }
    .hero-overlay { gap: 6px; }
    .hero-title { padding: 0 8px; }
    .nav-logo { height: 80px; }
  }
  @media (max-width: 360px) {
    .nav { padding: 14px 12px; }
    .nav-logo { height: 68px; }
    .tabs { gap: 14px; }
    .grid { padding: 20px 12px 36px; gap: 18px; }
    .detail { padding: 0 12px 36px; }
  }
  /* Touch devices: disable hover-driven scale on hero (better UX) */
  @media (hover: none) {
    .hero:hover .hero-img { transform: none; }
    .hero:hover .hero-play-btn { transform: none; }
    .card:hover { transform: none; }
    .card:hover .card-thumb img { transform: none; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="top">
  <div class="nav-brand" onclick="showHome()" role="button" aria-label="Ga naar homepagina">
    <img src="BARIZ_Logo1.png" alt="BARIZ" class="nav-logo">
  </div>
</nav>

<!-- HOME VIEW -->
<div id="homeView">
  <!-- Hero -->
  <div class="hero" id="heroSection">
    <img class="hero-img" id="heroImg" alt="">
    <div class="hero-overlay" onclick="openFeatured()">
      <span class="hero-tag">Videos</span>
      <h1 class="hero-title" id="heroTitle"></h1>
      <div class="hero-play-btn">
        <svg width="72" height="72" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="23" stroke="#fff" stroke-width="2" fill="rgba(0,0,0,.25)"/>
          <polygon points="19,14 36,24 19,34" fill="#fff"/>
        </svg>
      </div>
    </div>
    <button class="hero-arrow l" onclick="event.stopPropagation();prevHero()">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="hero-arrow r" onclick="event.stopPropagation();nextHero()">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs-wrap">
    <div class="tabs">
      <span class="tab active" onclick="setTab(this)">Latest</span>
      <span class="tab" onclick="setTab(this)">Popular</span>
      <span class="tab" onclick="setTab(this)">Originals</span>
      <span class="tab" onclick="setTab(this)">Exclusives</span>
    </div>
    <p class="tabs-sub">منصة رقمية تعنى بكل ما هو فني أو ثقافي</p>
  </div>

  <!-- Grid -->
  <div class="grid" id="videoGrid"></div>
</div>

<!-- DETAIL VIEW -->
<div id="detailView" style="display:none;">
  <div class="detail fade-in">
    <button class="back-btn" onclick="showHome()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to videos
    </button>

    <div class="video-wrap">
      <div id="ytPlayer"></div>
    </div>

    <h1 class="detail-title" id="detailTitle"></h1>

    <div class="detail-body" id="detailBody"></div>

    <div class="detail-credits" id="detailCredits"></div>

    <div class="more-section">
      <h2 class="more-title">More videos</h2>
      <div class="more-grid" id="moreGrid"></div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-heading">Contact</div>
    <div class="footer-contact">
      <span>Bariz tv</span>
      <a href="mailto:Bariztv7@gmail.com">Bariztv7@gmail.com</a>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-copy">© 2026 MinBiladi. All rights reserved.</div>
  </div>
</footer>

<script>
const VIDEOS = [
  {
    // Vanaf id tot en met producers, zijn eigenschappen van 1 video!
    id: 1,
    title: "سعيد الصنهاجي جديد كشكول شعبي 2025 ",
    subtitle: "سعيد الصنهاجي جديد كشكول شعبي 2025 ",
    category: "Music",
    type: "Video",
    duration: "8 minutes",
    ytId: "CWGvwpS-5g0",
    thumb: "https://img.youtube.com/vi/CWGvwpS-5g0/maxresdefault.jpg",
    description: [
"قناة بارز تقدم لكم من عالم الفن الشعبي المحبوب من طرف المغاربة كشكول من طرف الفنان الشعبي سعيد الصنهاجي"
],
    ]
  },
  {
    id: 2,
    title: "You Are Immune Against Every Disease",
    subtitle: "Your body already has a weapon against every possible disease — even ones that don't exist yet",
    category: "Biology",
    type: "Video",
    duration: "10 minutes",
    ytId: "LmpuerlbJu0",
    thumb: "https://img.youtube.com/vi/LmpuerlbJu0/maxresdefault.jpg",
    description: [
      "You are immune against every disease. Your body is capable of producing a specific weapon against any possible infection — even ones that have never existed and never will. How is this possible?",
    ]
  }
];

let heroIdx = 0;

// ─── SVG helpers ───
function playCircle(s) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none">
    <circle cx="24" cy="24" r="23" stroke="#fff" stroke-width="2" fill="rgba(0,0,0,.25)"/>
    <polygon points="19,14 36,24 19,34" fill="#fff"/>
  </svg>`;
}

// ─── RENDER HERO ───
function renderHero() {
  const v = VIDEOS[heroIdx];
  document.getElementById('heroImg').src = v.thumb;
  document.getElementById('heroImg').alt = v.title;
  document.getElementById('heroTitle').textContent = v.title;
}

function nextHero() { heroIdx = (heroIdx + 1) % VIDEOS.length; renderHero(); }
function prevHero() { heroIdx = (heroIdx - 1 + VIDEOS.length) % VIDEOS.length; renderHero(); }
function openFeatured() { openVideo(VIDEOS[heroIdx].id); }

// ─── RENDER GRID ───
function renderGrid() {
  const el = document.getElementById('videoGrid');
  el.innerHTML = VIDEOS.map((v, i) => `
    <div class="card fade-in" style="animation-delay:${i * .07}s" onclick="openVideo(${v.id})">
      <div class="card-thumb">
        <img src="${v.thumb}" alt="${v.title}" loading="lazy">
        <div class="card-play">${playCircle(40)}</div>
      </div>
      <div class="card-meta"><span>${v.type} / ${v.category}</span></div>
      <div class="card-title">${v.title}</div>
      <div class="card-dur">${v.duration}</div>
    </div>
  `).join('');
}

// ─── YOUTUBE IFRAME API ───
// We use the official IFrame Player API instead of a raw iframe.
// This guarantees that playsInline=1 is honored on iOS so the video
// stays on the website instead of opening the YouTube app or going
// to a fullscreen redirect. youtube-nocookie.com is used for better
// mobile compatibility.
let ytPlayer = null;
let ytApiReady = false;
let pendingVideoId = null;

// Load the IFrame API once
(function loadYouTubeAPI() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

// Called automatically by the YouTube API when ready
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  if (pendingVideoId) {
    createPlayer(pendingVideoId);
    pendingVideoId = null;
  }
};

function cleanYtId(ytId) {
  // Strip any stray query string ("abc?list=xyz" → "abc")
  return String(ytId).split('?')[0].split('&')[0];
}

function createPlayer(videoId) {
  // If a player already exists, just load the new video into it
  if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
    ytPlayer.loadVideoById(videoId);
    return;
  }

  ytPlayer = new YT.Player('ytPlayer', {
    host: 'https://www.youtube-nocookie.com',
    videoId: videoId,
    playerVars: {
      rel: 0,
      modestbranding: 1,
      playsinline: 1,   // critical for iOS — keeps video inline
      fs: 1,            // allow fullscreen button
      enablejsapi: 1,
      origin: window.location.origin
    },
    events: {
      onReady: function (e) {
        // Try to start playback automatically (may be blocked by
        // the browser without a user gesture; the user can still tap play)
        try { e.target.playVideo(); } catch (err) {}
      }
    }
  });
}

function destroyPlayer() {
  if (ytPlayer && typeof ytPlayer.destroy === 'function') {
    ytPlayer.destroy();
  }
  ytPlayer = null;
  // Restore the placeholder div so the API can re-mount next time
  const wrap = document.querySelector('.video-wrap');
  if (wrap && !document.getElementById('ytPlayer')) {
    const div = document.createElement('div');
    div.id = 'ytPlayer';
    wrap.appendChild(div);
  }
}

// ─── OPEN VIDEO ───
function openVideo(id) {
  const v = VIDEOS.find(x => x.id === id);
  if (!v) return;

  document.getElementById('homeView').style.display = 'none';
  const dv = document.getElementById('detailView');
  dv.style.display = 'block';

  // Reset fade
  const detail = dv.querySelector('.detail');
  detail.classList.remove('fade-in');
  void detail.offsetWidth;
  detail.classList.add('fade-in');

  const cleanId = cleanYtId(v.ytId);
  if (ytApiReady) {
    createPlayer(cleanId);
  } else {
    // API not loaded yet — queue it up
    pendingVideoId = cleanId;
  }

  document.getElementById('detailTitle').textContent = v.subtitle;

  // Body
  const bodyHtml = v.description.map(p => `<p>${p}</p>`).join('');
  document.getElementById('detailBody').innerHTML = bodyHtml;


  // More videos
  const others = VIDEOS.filter(x => x.id !== v.id).slice(0, 3);
  document.getElementById('moreGrid').innerHTML = others.map(o => `
    <div class="card" onclick="openVideo(${o.id})">
      <div class="card-thumb">
        <img src="${o.thumb}" alt="${o.title}" loading="lazy">
        <div class="card-play">${playCircle(36)}</div>
      </div>
      <div class="card-meta"><span>${o.type} / ${o.category}</span></div>
      <div class="card-title">${o.title}</div>
      <div class="card-dur">${o.duration}</div>
    </div>
  `).join('');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── SHOW HOME ───
function showHome() {
  destroyPlayer();
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('homeView').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── TABS ───
function setTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

// ─── INIT ───
renderHero();
renderGrid();
</script>
</body>
</html>
